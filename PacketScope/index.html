<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PacketScope</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Consolas, monospace;
    }

    body{
      background:#0b0f14;
      color:#d6d6d6;
      overflow:hidden;
    }

    body::before{
      content:"";
      position:fixed;
      inset:0;
      background:
      linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size:40px 40px;
      pointer-events:none;
    }

    .header{
      height:70px;
      border-bottom:1px solid #222;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 20px;
      background:#111821;
      position:sticky;
      top:0;
      z-index:100;
    }

    .logo{
      font-size:24px;
      color:#ffb347;
      font-weight:bold;
    }

    .status{
      display:flex;
      gap:20px;
      align-items:center;
    }

    .live{
      color:#00ff88;
      font-weight:bold;
    }

    .btn{
      background:#ffb347;
      color:#111;
      border:none;
      padding:10px 16px;
      border-radius:6px;
      cursor:pointer;
      font-weight:bold;
    }

    .btn:hover{
      opacity:0.9;
    }

    .container{
      display:grid;
      grid-template-columns:280px 1fr 420px;
      height:calc(100vh - 70px);
    }

    .sidebar{
      border-right:1px solid #222;
      padding:20px;
      overflow:auto;
      background:#0e141c;
    }

    .main{
      overflow:auto;
      padding:15px;
    }

    .details{
      border-left:1px solid #222;
      background:#0e141c;
      overflow:auto;
      padding:20px;
    }

    .section-title{
      color:#ffb347;
      margin-bottom:10px;
      margin-top:20px;
      font-size:14px;
      text-transform:uppercase;
    }

    select,input{
      width:100%;
      background:#151d28;
      border:1px solid #333;
      color:white;
      padding:10px;
      border-radius:6px;
      margin-bottom:10px;
    }

    .tags{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
    }

    .tag{
      padding:6px 10px;
      border-radius:20px;
      background:#1a2533;
      cursor:pointer;
      border:1px solid #333;
      font-size:12px;
    }

    .tag.active{
      background:#ffb347;
      color:black;
      font-weight:bold;
    }

    .stats{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
      margin-top:10px;
    }

    .card{
      background:#151d28;
      padding:12px;
      border-radius:8px;
      border:1px solid #222;
    }

    .card h4{
      color:#999;
      font-size:12px;
      margin-bottom:5px;
    }

    .card p{
      font-size:18px;
      color:#00ffaa;
    }

    .table-controls{
      display:flex;
      justify-content:space-between;
      margin-bottom:10px;
    }

    .packet-table{
      width:100%;
      border-collapse:collapse;
    }

    .packet-table th{
      background:#111821;
      color:#ffb347;
      position:sticky;
      top:0;
      padding:12px;
      border-bottom:1px solid #333;
      cursor:pointer;
    }

    .packet-table td{
      padding:10px;
      border-bottom:1px solid #1d2733;
      font-size:13px;
    }

    .packet-table tr:hover{
      background:#151d28;
      cursor:pointer;
    }

    .proto{
      padding:4px 8px;
      border-radius:6px;
      font-weight:bold;
      color:white;
    }

    .TCP{ background:#0077ff; }
    .UDP{ background:#00aa88; }
    .HTTP{ background:#ff8800; }
    .HTTPS{ background:#aa55ff; }
    .DNS{ background:#00bbbb; }
    .ICMP{ background:#ff4444; }
    .ARP{ background:#888888; }

    .detail-box{
      background:#151d28;
      padding:15px;
      border-radius:10px;
      margin-bottom:15px;
      border:1px solid #222;
    }

    .detail-box h3{
      color:#ffb347;
      margin-bottom:10px;
    }

    pre{
      white-space:pre-wrap;
      word-break:break-word;
      color:#00ffaa;
      font-size:12px;
    }

    .bar{
      height:18px;
      background:#1a2533;
      border-radius:20px;
      overflow:hidden;
      margin-top:10px;
    }

    .bar-fill{
      height:100%;
      width:65%;
      background:linear-gradient(to right,#ffb347,#00ffaa);
    }

  </style>
</head>

<body>

<div class="header">
  <div class="logo">PacketScope</div>

  <div class="status">
    <div class="live">● LIVE CAPTURE</div>
    <div>RX: <span id="rx">0 KB/s</span></div>
    <div>TX: <span id="tx">0 KB/s</span></div>

    <button class="btn" onclick="toggleCapture()" id="captureBtn">
      Start Capture
    </button>

    <button class="btn" onclick="exportJSON()">
      Export JSON
    </button>
  </div>
</div>

<div class="container">

  <!-- SIDEBAR -->
  <div class="sidebar">

    <div class="section-title">Interface</div>

    <select>
      <option>eth0</option>
      <option>wlan0</option>
      <option>lo</option>
      <option>docker0</option>
    </select>

    <div class="section-title">Filters</div>

    <input type="text" placeholder="BPF Expression">
    <input type="text" placeholder="Host / Port Filter">

    <div class="section-title">Protocols</div>

    <div class="tags">
      <div class="tag active">TCP</div>
      <div class="tag active">UDP</div>
      <div class="tag active">HTTP</div>
      <div class="tag active">HTTPS</div>
      <div class="tag active">DNS</div>
      <div class="tag active">ICMP</div>
      <div class="tag active">ARP</div>
    </div>

    <div class="section-title">Session Stats</div>

    <div class="stats">
      <div class="card">
        <h4>Packets</h4>
        <p id="packetCount">0</p>
      </div>

      <div class="card">
        <h4>Bytes</h4>
        <p id="byteCount">0</p>
      </div>

      <div class="card">
        <h4>Duration</h4>
        <p id="duration">0s</p>
      </div>

      <div class="card">
        <h4>Avg/s</h4>
        <p id="avg">0</p>
      </div>
    </div>

    <div class="section-title">Protocol Distribution</div>

    <div class="bar">
      <div class="bar-fill"></div>
    </div>

  </div>

  <!-- MAIN TABLE -->
  <div class="main">

    <div class="table-controls">
      <input type="text" placeholder="Display Filter">
    </div>

    <table class="packet-table">
      <thead>
        <tr>
          <th>Time</th>
          <th>Source</th>
          <th>Destination</th>
          <th>Protocol</th>
          <th>Length</th>
          <th>Info</th>
        </tr>
      </thead>

      <tbody id="packetBody"></tbody>

    </table>

  </div>

  <!-- DETAILS -->
  <div class="details">

    <div class="detail-box">
      <h3>Layers</h3>

      <pre id="layerData">
Select a packet...
      </pre>
    </div>

    <div class="detail-box">
      <h3>Hex Dump</h3>

      <pre id="hexData">
--
      </pre>
    </div>

    <div class="detail-box">
      <h3>Raw</h3>

      <pre id="rawData">
--
      </pre>
    </div>

  </div>

</div>

<script>

const protocols = ["TCP","UDP","HTTP","HTTPS","DNS","ICMP","ARP"];
const packetBody = document.getElementById("packetBody");

let packets = [];
let capturing = false;
let interval;
let startTime;

function randomIP(){
  return `${rand(1,255)}.${rand(0,255)}.${rand(0,255)}.${rand(1,255)}`;
}

function rand(min,max){
  return Math.floor(Math.random()*(max-min+1))+min;
}

function randomHex(length=64){
  const chars = "0123456789ABCDEF";
  let out = "";

  for(let i=0;i<length;i++){
    out += chars[rand(0,15)];
  }

  return out;
}

function createPacket(){

  const proto = protocols[rand(0, protocols.length-1)];

  const packet = {
    time: new Date().toLocaleTimeString(),
    src: randomIP(),
    dst: randomIP(),
    protocol: proto,
    length: rand(40,1500),
    info: `${proto} Packet`,
    raw: randomHex(120)
  };

  packets.unshift(packet);

  if(packets.length > 200){
    packets.pop();
  }

  renderPackets();

  updateStats();

}

function renderPackets(){

  packetBody.innerHTML = "";

  packets.forEach(packet => {

    const row = document.createElement("tr");

    row.innerHTML = `
      <td>${packet.time}</td>
      <td>${packet.src}</td>
      <td>${packet.dst}</td>
      <td><span class="proto ${packet.protocol}">${packet.protocol}</span></td>
      <td>${packet.length}</td>
      <td>${packet.info}</td>
    `;

    row.onclick = () => showDetails(packet);

    packetBody.appendChild(row);

  });

}

function showDetails(packet){

  document.getElementById("layerData").textContent = `
Ethernet II
  Source MAC: 00:11:22:33:44:55
  Destination MAC: AA:BB:CC:DD:EE:FF

IPv4
  Source IP: ${packet.src}
  Destination IP: ${packet.dst}

${packet.protocol}
  Length: ${packet.length}
  Flags: ACK, SYN
`;

  document.getElementById("hexData").textContent = packet.raw.match(/.{1,32}/g).join("\n");

  document.getElementById("rawData").textContent = packet.raw;

}

function toggleCapture(){

  const btn = document.getElementById("captureBtn");

  if(!capturing){

    capturing = true;
    btn.innerText = "Stop Capture";

    startTime = Date.now();

    interval = setInterval(createPacket, 700);

  }else{

    capturing = false;
    btn.innerText = "Start Capture";

    clearInterval(interval);

  }

}

function updateStats(){

  document.getElementById("packetCount").innerText = packets.length;

  const bytes = packets.reduce((a,b)=>a+b.length,0);

  document.getElementById("byteCount").innerText = bytes;

  const duration = Math.floor((Date.now()-startTime)/1000);

  document.getElementById("duration").innerText = duration+"s";

  document.getElementById("avg").innerText =
    duration > 0 ? Math.floor(packets.length/duration) : 0;

  document.getElementById("rx").innerText =
    rand(10,300)+" KB/s";

  document.getElementById("tx").innerText =
    rand(10,300)+" KB/s";

}

function exportJSON(){

  const data = JSON.stringify(packets.slice(0,100), null, 2);

  const blob = new Blob([data], {type:"application/json"});

  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");

  a.href = url;
  a.download = "packets.json";

  a.click();

}

</script>

</body>
</html>
